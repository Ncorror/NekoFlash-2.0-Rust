name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      sign_release:
        description: "Build signed APK (main only, approved release environment)"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPECTED_RELEASE_CERT_SHA256: "3d9d8ec98ff5a0aa5e72a257f02babe19c0ff91f0af431955aa9afe8901cf5b2"

jobs:
  build:
    if: ${{ github.repository == 'Ncorror/NekoFlash-2.0' || github.event_name != 'workflow_dispatch' || !inputs.sign_release }}
    runs-on: ubuntu-latest
    # Ordinary CI uses only public artifacts; manual signing needs approved release environment.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' && 'nekoflash-release' || 'nekoflash-ci' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reserve disk for Android toolchains and both emulator runs
        run: |
          # This GitHub-hosted runner is disposable. None of these preinstalled SDKs are used here.
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost "$RUNNER_TOOL_CACHE/CodeQL"
          df -h "$RUNNER_TEMP"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Gradle Wrapper checkout
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh 2>/dev/null || true

      - name: Print Gradle version
        run: ./gradlew --version

      - name: Verify repository security gates
        run: |
          python3 tests/check_repository_security.py
          python3 tests/check_branch_cleanup.py

      - name: REV27 structural and source-guard tests
        run: |
          python3 tests/check_rev27.py
          python3 tests/check_terminal_welcome.py
          python3 tests/check_i18n.py
          python3 tests/check_docs.py
          python3 tests/check_tester_kit.py
          python3 tests/check_diagnostic_zip_verifier.py

      - name: Native transfer deadline regression tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/native_transfer_deadline_test.cpp -o /tmp/native-deadline-test
          /tmp/native-deadline-test

      - name: Install filesystem integration-test tools
        run: |
          bash scripts/ci-install-filesystem-deps.sh e2fsprogs f2fs-tools autoconf automake libtool pkg-config

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Build pinned Android filesystem generators
        timeout-minutes: 20
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          python3 scripts/build_filesystem_tools.py --ndk "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Kotlin JVM queue and diagnostic regression tests
        timeout-minutes: 15
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Android lint
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee lint_log.txt

      - name: Build Debug APK
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee debug_build_log.txt

      - name: Build Fastboot range client for the Android emulators
        run: |
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --manifest-path rust/Cargo.toml --locked --release --target x86_64-linux-android \
            --target-dir "$RUNNER_TEMP/nekoflash-range-build" -p nekoflash-fastboot --example fetch_range
          install -Dm755 "$RUNNER_TEMP/nekoflash-range-build/x86_64-linux-android/release/examples/fetch_range" build/android-tools/fetch_range
          rm -rf "$RUNNER_TEMP/nekoflash-range-build"

      - name: Verify APK filesystem executables and build instrumentation APK
        id: apks
        run: |
          python3 tests/check_filesystem_apk.py app/build/outputs/apk/debug/app-debug.apk
          ./gradlew :app:assembleDebugAndroidTest --no-daemon --console=plain

      - name: Summarize test and lint reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          from xml.etree import ElementTree as ET
          results = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert results, 'JUnit reports missing'
          totals = Counter()
          for report in results:
              suite = ET.parse(report).getroot()
              totals.update({key: int(suite.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')})
          print('JUnit summary:', dict(totals))
          lint = ET.parse('app/build/reports/lint-results-debug.xml').getroot()
          print('Lint severities:', dict(Counter(issue.get('severity') for issue in lint.findall('issue'))))
          print('Lint issue types:', dict(Counter(issue.get('id') for issue in lint.findall('issue'))))
          for issue in lint.findall('issue'):
              if issue.get('severity') not in ('Warning', 'Error', 'Fatal'):
                  continue
              locations = issue.findall('location')
              loc = locations[0] if locations else None
              path = loc.get('file', '?') if loc is not None else '?'
              line = loc.get('line', '?') if loc is not None else '?'
              print(f"LINT DETAIL: {issue.get('severity')} {issue.get('id')} "
                    f"{path}:{line} — {issue.get('message')}")
          findings = [issue for issue in lint.findall('issue')
                      if issue.get('severity') in ('Warning', 'Error', 'Fatal')]
          assert not findings, f"Android Lint must be warning-free: {len(findings)} findings"
          PY

      - name: Prepare Debug artifact
        id: debug_package
        run: |
          set -euo pipefail

          VERSION_NAME="$(
            sed -nE \
              's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              app/build.gradle | head -1
          )"

          DEBUG_APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          test -n "$VERSION_NAME"
          test -n "$DEBUG_APK"
          test -f "$DEBUG_APK"

          mkdir -p artifacts/debug

          cp "$DEBUG_APK" \
            "artifacts/debug/NekoFlash-${VERSION_NAME}-debug.apk"

          cp build/filesystem-tools/filesystem-tools-source.tar.gz artifacts/debug/
          cp build/filesystem-tools/build-info.json artifacts/debug/filesystem-tools-build-info.json

          cd artifacts/debug
          sha256sum *.apk > checksums-sha256.txt

          ls -lh
          cat checksums-sha256.txt

      - name: Verify tester kit against the built APK
        run: |
          python3 scripts/package_tester_kit.py artifacts/debug "$RUNNER_TEMP/tester-kit" --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
          python3 scripts/verify_tester_kit.py "$RUNNER_TEMP/tester-kit" --source-artifact artifacts/debug --commit "$GITHUB_SHA"

      - name: Prepare emulator access and disk space
        run: |
          sudo chmod 666 /dev/kvm
          # APKs, reports, generator binaries and corresponding source archives live outside these intermediates.
          rm -rf app/.cxx app/build/intermediates build/filesystem-tools/work build/filesystem-tools/src
          df -h "$RUNNER_TEMP"

      - name: Installed app on Android API 26
        if: ${{ !cancelled() && steps.apks.outcome == 'success' }}
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          avd-name: nekoflash-api26
          disable-animations: true
          script: bash scripts/ci-installed-app.sh 26

      - name: Release the API 26 emulator disk before installing API 34
        if: ${{ !cancelled() && steps.apks.outcome == 'success' }}
        run: |
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if "$avdmanager" list avd -c | grep -Fxq nekoflash-api26; then
            "$avdmanager" delete avd -n nekoflash-api26
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --uninstall 'system-images;android-26;google_apis;x86_64'
          df -h "$RUNNER_TEMP"

      - name: Installed app on Android API 34
        if: ${{ !cancelled() && steps.apks.outcome == 'success' }}
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          avd-name: nekoflash-api34
          disable-animations: true
          script: bash scripts/ci-installed-app.sh 34

      - name: Bundle Android filesystem evidence
        if: ${{ !cancelled() && steps.apks.outcome == 'success' }}
        run: |
          set -eu
          for api in 26 34; do
            archive="android-filesystem-evidence-api${api}.tar.gz"
            tar -C "build/android-evidence/api$api" -czf "$archive" .
            sha256sum "$archive" > "${archive}.sha256"
          done

      - name: Upload Android API 26 evidence
        if: ${{ !cancelled() && steps.apks.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NekoFlash-${{ github.sha }}-mkfs-api26
          path: android-filesystem-evidence-api26.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload Android API 34 evidence
        if: ${{ !cancelled() && steps.apks.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NekoFlash-${{ github.sha }}-mkfs-api34
          path: android-filesystem-evidence-api34.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload instrumentation APK
        if: ${{ !cancelled() && steps.apks.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NekoFlash-${{ github.sha }}-android-test
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload inspectable lint and JVM reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NekoFlash-lint-and-unit-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Debug APK
        if: ${{ !cancelled() && steps.debug_package.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NekoFlash-${{ github.sha }}-debug
          path: artifacts/debug/*
          if-no-files-found: error
          retention-days: 7

      - name: Require and verify release signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        env:
          NEKOFLASH_KEYSTORE_BASE64: ${{ secrets.NEKOFLASH_KEYSTORE_BASE64 }}
          NEKOFLASH_STORE_PASSWORD: ${{ secrets.NEKOFLASH_STORE_PASSWORD }}
          NEKOFLASH_KEY_ALIAS: ${{ secrets.NEKOFLASH_KEY_ALIAS }}
          NEKOFLASH_KEY_PASSWORD: ${{ secrets.NEKOFLASH_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$NEKOFLASH_KEYSTORE_BASE64" ] || {
            echo "::error::Missing NEKOFLASH_KEYSTORE_BASE64"
            exit 1
          }

          [ -n "$NEKOFLASH_STORE_PASSWORD" ] || {
            echo "::error::Missing NEKOFLASH_STORE_PASSWORD"
            exit 1
          }

          [ -n "$NEKOFLASH_KEY_ALIAS" ] || {
            echo "::error::Missing NEKOFLASH_KEY_ALIAS"
            exit 1
          }

          [ -n "$NEKOFLASH_KEY_PASSWORD" ] || {
            echo "::error::Missing NEKOFLASH_KEY_PASSWORD"
            exit 1
          }

          KEYSTORE_PATH="$RUNNER_TEMP/nekoflash-release.jks"

          printf '%s' "$NEKOFLASH_KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          CERT_PEM="$RUNNER_TEMP/nekoflash-release-cert.pem"

          keytool \
            -exportcert \
            -rfc \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$NEKOFLASH_STORE_PASSWORD" \
            -alias "$NEKOFLASH_KEY_ALIAS" \
            > "$CERT_PEM"

          ACTUAL_CERT_SHA256="$(
            openssl x509 \
              -in "$CERT_PEM" \
              -noout \
              -fingerprint \
              -sha256 |
            sed 's/^.*=//' |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]'
          )"

          echo "Expected certificate: $EXPECTED_RELEASE_CERT_SHA256"
          echo "Actual certificate:   $ACTUAL_CERT_SHA256"

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "::error::Release certificate SHA-256 mismatch"
            exit 1
          fi

          echo "NEKOFLASH_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Release keystore verified."

      - name: Build signed Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        timeout-minutes: 20
        env:
          NEKOFLASH_STORE_PASSWORD: ${{ secrets.NEKOFLASH_STORE_PASSWORD }}
          NEKOFLASH_KEY_ALIAS: ${{ secrets.NEKOFLASH_KEY_ALIAS }}
          NEKOFLASH_KEY_PASSWORD: ${{ secrets.NEKOFLASH_KEY_PASSWORD }}
        run: |
          set -o pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee release_build_log.txt

      - name: Verify Release APK signature
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail

          RELEASE_APK="$(
            find app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          test -n "$RELEASE_APK"
          test -f "$RELEASE_APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          [ -n "$SDK_ROOT" ] || {
            echo "::error::Android SDK root not found"
            exit 1
          }

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -type f \
              -name apksigner \
              -print |
            sort -V |
            tail -1
          )"

          [ -n "$APKSIGNER" ] || {
            echo "::error::apksigner not found"
            exit 1
          }

          set -o pipefail

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$RELEASE_APK" |
            tee apk-signature.txt

          APK_CERT_SHA256="$(
            sed -nE \
              's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' \
              apk-signature.txt |
            head -n 1 |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]'
          )"

          [ -n "$APK_CERT_SHA256" ] || {
            echo "::error::Unable to read APK certificate SHA-256"
            exit 1
          }

          echo "Expected APK certificate: $EXPECTED_RELEASE_CERT_SHA256"
          echo "Actual APK certificate:   $APK_CERT_SHA256"

          if [ "$APK_CERT_SHA256" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "::error::Signed APK certificate does not match NekoFlash release key"
            exit 1
          fi

          echo "APK signature and certificate verified."

      - name: Prepare signed Release artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail

          VERSION_NAME="$(
            sed -nE \
              's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              app/build.gradle | head -1
          )"

          VERSION_CODE="$(
            sed -nE \
              's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' \
              app/build.gradle | head -1
          )"

          RELEASE_APK="$(
            find app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          test -n "$RELEASE_APK"
          test -f "$RELEASE_APK"

          mkdir -p artifacts/release

          FINAL_APK="artifacts/release/NekoFlash-${VERSION_NAME}-release.apk"

          cp "$RELEASE_APK" "$FINAL_APK"
          cp apk-signature.txt artifacts/release/apk-signature.txt

          cat > artifacts/release/build-info.txt <<EOF
          NekoFlash build
          versionName=$VERSION_NAME
          versionCode=$VERSION_CODE
          gitCommit=$GITHUB_SHA
          gitRunId=$GITHUB_RUN_ID
          gitRunNumber=$GITHUB_RUN_NUMBER
          releaseSigned=true
          certificateSha256=$EXPECTED_RELEASE_CERT_SHA256
          EOF

          python3 tests/check_filesystem_apk.py "$FINAL_APK"
          cp build/filesystem-tools/filesystem-tools-source.tar.gz artifacts/release/
          cp build/filesystem-tools/build-info.json artifacts/release/filesystem-tools-build-info.json

          cd artifacts/release

          if find . -type f -iname '*unsigned*' | grep -q .; then
            echo "::error::Unsigned artifact detected"
            exit 1
          fi

          sha256sum *.apk > checksums-sha256.txt

          ls -lh
          cat build-info.txt
          cat checksums-sha256.txt

      - name: Upload signed Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NekoFlash-${{ github.sha }}-release
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Show build errors if failed
        if: failure()
        run: |
          echo "==================== BUILD ERRORS ===================="

          for log in \
            lint_log.txt \
            debug_build_log.txt \
            release_build_log.txt \
            apk-signature.txt
          do
            if [ -f "$log" ]; then
              echo "---- $log ----"

              grep -E \
                "^e: |error:|FAILED|What went wrong|Unresolved|Caused by|resource .* not found|OutOfMemoryError|certificate|signature" \
                "$log" |
                head -160 || true
            fi
          done

          echo "======================================================"

      - name: Upload build and lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NekoFlash-${{ github.sha }}-reports
          path: |
            lint_log.txt
            debug_build_log.txt
            release_build_log.txt
            apk-signature.txt
            build/filesystem-tools/*.log
            build/filesystem-tools/build-info.json
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 3

  tester-kit:
    name: Package verified tester APK
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: NekoFlash-${{ github.sha }}-debug
          path: kit-input
      - name: Stage and verify APK-only kit
        run: |
          python3 scripts/package_tester_kit.py kit-input tester-kit --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
          python3 scripts/verify_tester_kit.py tester-kit --source-artifact kit-input --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: upload
        with:
          name: NekoFlash-Tester-Kit
          path: tester-kit/
          if-no-files-found: error
          retention-days: 7
